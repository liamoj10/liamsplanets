<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Simulator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Title & Status -->
  <div id="header">
    <h1>Solar System Simulator</h1>
    <div id="status">Connecting to GET /state...</div>
  </div>

  <!-- Planet Canvas Viewport -->
  <canvas id="spaceCanvas"></canvas>

  <!-- Planet Inspector Sidebar -->
  <aside id="inspector">
    <div id="inspector-title">
      <span id="inspector-dot"></span>
      <span id="planet-name">Select Planet</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Position</span>
      <span class="stat-val" id="stat-pos">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Velocity</span>
      <span class="stat-val" id="stat-vel">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Speed</span>
      <span class="stat-val" id="stat-speed">-</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Radius</span>
      <span class="stat-val" id="stat-radius">-</span>
    </div>

    <!-- Quick list of bodies -->
    <div style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; margin-top: 6px;">Planets</div>
    <div id="planet-list"></div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
